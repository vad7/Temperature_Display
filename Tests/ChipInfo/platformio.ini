; ChipInfo - проверка МК (тип чипа, фьюзы, загрузчик) и стресс-тест (например, при 3.3 В).
; Сборка и загрузка:  pio run -d Tests/ChipInfo -t upload      Монитор: pio device monitor -d Tests/ChipInfo
; Окружения - по кварцу: nano8 - 8 МГц (Pro Mini 328 3.3 В, Baite BTE13-010, по умолчанию);
;            nano16 - 16 МГц (Nano, Pro Mini 16 МГц). Загрузчик - [upload] ниже.
; Arduino IDE: открыть ChipInfo.ino, плата MiniCore ATmega328, Clock: External 8 MHz (Nano - 16 MHz).
; Новая плата: сначала загрузчик программатором - из корня репозитория pio run -e isp -t bootloader (Readme §8).

[platformio]
src_dir = .
default_envs = nano8

; загрузчик платы: urboot / optiboot / atmegaboot (old) - как в ../../platformio.ini, разово - BOOTLOADER
[upload]
bootloader = urboot

[env]
platform = atmelavr@5.3.0
framework = arduino
board = ATmega328P                     ; ядро MiniCore
board_hardware.oscillator = external
monitor_speed = 38400
build_src_filter = +<*> -<.pio/>
build_flags =
    -Os
    -Wall
    -Wstrict-aliasing=1
    -fpack-struct
custom_bootloader = ${upload.bootloader}
extra_scripts =
    pre:../../Scripts/upload_select.py
    post:../../Scripts/copy_hex.py

[env:nano8]
board_build.f_cpu = 8000000L
; протокол и скорость - по [upload] bootloader (Scripts/upload_select.py); ниже - для urboot
upload_protocol = urclock
upload_speed = 57600

[env:nano16]
board_build.f_cpu = 16000000L
; протокол и скорость - по [upload] bootloader (Scripts/upload_select.py); ниже - для urboot
upload_protocol = urclock
upload_speed = 57600
