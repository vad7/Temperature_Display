; Цифровой термометр: ATmega328P (аналог Arduino Pro Mini 3.3 В / 8 МГц, ядро MiniCore) + DS18B20 / SHT40 + SPI TFT.
; Экран - секция [display] ниже (разрешение и контроллер); окружение = кварц ATmega328P (пользователь 2026-10-29):
; nano8 - кварц 8 МГц (Pro Mini 3.3 В, основная), nano16 - кварц 16 МГц с делителем на 8 МГц (Nano, Pro Mini 16 МГц).
; Датчик определяется при старте: сначала SHT40 (I2C), иначе DS18B20 (1-Wire).
; Сборка (из корня репозитория):  pio run -e nano8       Загрузка: pio run -e nano8 -t upload
; Новая плата - загрузчик программатором: pio run -e isp -t bootloader (окружение isp внизу)
; Другой экран без правки файла - переменные окружения LCD_RES / LCD_CTRL (см. Scripts/display_select.py)
; Исходники - в TempDisplay/ (src, include, lib, test); platformio.ini - в корне, чтобы VS Code / PlatformIO
; видели проект в обычной папке без рабочей области (как в проекте хаба CO2).
; Настройки MiniCore: https://github.com/MCUdude/MiniCore/blob/master/PlatformIO.md

[platformio]
default_envs = nano8
src_dir = TempDisplay/src
include_dir = TempDisplay/include
lib_dir = TempDisplay/lib
test_dir = TempDisplay/test

; ---------------------------------------------------------------- экран (выбрать перед сборкой)
;   res = 128x160, ctrl = ST7735  - 1.77" / 1.8" (тип инициализации и порядок цветов - TFT_ST7735_TAB в config.h)
;   res = 240x320, ctrl = ST7789  - 2.4" (по названию у продавца)
;   res = 240x320, ctrl = ILI9341 - 2.4" LCDWIKI MSP2401 / MSP2402 и 2.8" MSP2806 / MSP2807 (по документам LCDWIKI)
; Проверка Scripts/display_select.py: недопустимое сочетание - ошибка сборки.
[display]
res = 128x160
ctrl = ST7735

; ---------------------------------------------------------------- загрузчик платы (выбрать перед прошивкой)
;   urboot     - MiniCore (urclock; 57600 при 8 и 16 МГц), 384 б; после записи программатором (env:isp)
;   optiboot   - «новый» загрузчик Nano / Uno, стандартный у китайских Nano (arduino, 115200), 512 б
;   atmegaboot - штатный Pro Mini и «Old Bootloader» Nano (arduino, 57600), 2 КБ (синонимы: old, new = optiboot)
; Разово - переменная окружения BOOTLOADER; таблица и проверка - Scripts/upload_select.py; какой на плате - Readme §8.
[upload]
bootloader = urboot

[env]
platform = atmelavr@5.3.0
framework = arduino
board = ATmega328P                     ; ядро MiniCore
; Плата - аналог Pro Mini 3.3 В Baite BTE13-010: кварц 8 МГц (пользователь), питание 3.3 В от HLK-3M03C.
; Делитель CLKPR не нужен (с кварцем 16 МГц было бы -DOSC_PRESCALER=0x01 в build_flags).
board_build.f_cpu = 8000000L
board_hardware.oscillator = external

; Протокол, скорость и место под загрузчик задаёт Scripts/upload_select.py по [upload] bootloader и кварцу
; (custom_xtal, по умолчанию f_cpu); ниже - значения для urboot. Кварц 16 МГц - окружение nano16 ниже.
upload_protocol = urclock
upload_speed = 57600
custom_bootloader = ${upload.bootloader}
monitor_speed = 38400                  ; Serial программы на 8 МГц: ошибка 0.2% (115200 - 3.5%)

; -Os (ядро задаёт само), -Wstrict-aliasing=1, PackStructureMembers (-fpack-struct)
build_flags =
    -DWIRE_TIMEOUT                      ; тайм-аут Wire в MiniCore (Wire_timeout.h): залипшая I2C не вешает МК
    -Os
    -Wall
    -Wstrict-aliasing=1
    -fpack-struct
    ; встроенный шрифт Adafruit GFX 5x7 не используется (свой - setFont в layout()), 1280 б flash: glcdfont.c
    ; пропускается по его защите FONT5X7_H, font - заглушка для drawChar(). Текст без setFont - мусор на экране
    -DFONT5X7_H
    '-Dfont=((const unsigned char*)0)'

lib_deps =
    adafruit/Adafruit GFX Library@^1.13.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.12.0
    adafruit/Adafruit ILI9341@^1.7.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6

custom_lcd_res = ${display.res}
custom_lcd_ctrl = ${display.ctrl}
extra_scripts =
    pre:Scripts/display_select.py       ; [display] -> LCD_RES / LCD_CTRL, суффикс имени hex
    pre:Scripts/upload_select.py        ; [upload] -> протокол, скорость, место под загрузчик
    post:Scripts/copy_hex.py

[env:nano8]
; кварц 8 МГц (основная плата - Pro Mini 3.3 В / 8 МГц): всё из [env]

; Кварц 16 МГц (клон Nano, Pro Mini 16 МГц): делитель CLKPR / 2 -> 8 МГц (ядро MiniCore включает его в init() по
; OSC_PRESCALER; на клоне Nano проверено - ChipInfo, команда k). Загрузчик работает до init() на 16 МГц.
[env:nano16]
upload_speed = 57600                    ; urboot: на 115200 сбои передачи (Scripts/upload_select.py)
custom_xtal = 16000000                  ; кварц (скорость загрузчика), f_cpu программы - 8 МГц
build_flags = ${env.build_flags} -DOSC_PRESCALER=0x01

; Новая плата (Pro Mini и Nano): фьюзы и загрузчик MiniCore urboot программатором ISP (Readme §8, «Новая плата»):
;   pio run -e isp -t bootloader
; Стирает flash (и EEPROM, если фьюз EESAVE ещё не стоял). Фьюзы: L 0xF7 (внешний кварц), H 0xD7 (EEPROM
; сохраняется), E 0xFD (BOD 2.7 В); загрузчик - autobaud (один для 8 и 16 МГц), сторож 1 с, светодиод B5.
; Программатор: Arduino as ISP (ниже; скетч ArduinoISP на 115200 = «Arduino as ISP fast», штатный скетч - 19200;
; COM7 - порт платы-программатора) или USBasp:
;   upload_protocol = usbasp
;   upload_flags = -B 10                     ; медленный SCK - надёжно для любой платы
; Подпись 00 00 00 (или FF FF FF) при отвечающем программаторе - обрыв провода ISP / RESET, не писать с -F.
[env:isp]
upload_protocol = stk500v1
upload_flags = -PCOM7 -b115200
